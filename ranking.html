      border: 1.5px solid #FCA5A5;
      border-radius: 3px;
      z-index: 11;
      transform: skewX(-12deg);
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      white-space: nowrap;
    }

    /* -------------------------------------------
       中枠（サムネイル＆レーダー枠）
    ------------------------------------------- */
    .art-frame {
      position: relative;
      height: 225px;
      width: 97%;
      align-self: center;
      border-radius: 10px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 6px 16px rgba(0,0,0,0.6);
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 15px 35px 15px;
      z-index: 1;
    }

    .ea-thumbnail {
      width: 145px;
      height: 145px;
      border-radius: 18px;
      box-shadow: 8px 12px 25px rgba(0,0,0,0.85), -2px -2px 10px rgba(255,255,255,0.3);
      object-fit: cover;
      transform: perspective(800px) rotateY(15deg) rotateZ(-5deg) scale(1.05);
      z-index: 2;
      border: 2px solid rgba(255,255,255,0.4);
      background-color: #0f172a;
    }

    .radar-circle {
      width: 150px;
      height: 150px;
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(6px);
      border: 2px solid rgba(56, 189, 248, 0.5);
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0,0,0,0.9), inset 0 0 10px rgba(56, 189, 248, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px;
      z-index: 2;
    }

    /* -------------------------------------------
       スキル枠
    ------------------------------------------- */
    .skill-banner-container {
      position: relative;
      height: 90px;
      width: 92%;
      align-self: center;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px 4px 20px;
      margin-top: -42px;
      margin-bottom: -9px;
      z-index: 5;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.95));
    }
    
    .skill-tags-text {
      color: #FFF;
      font-weight: bold;
      font-style: italic;
      font-family: 'Yu Gothic UI', '游ゴシック体', 'Yu Gothic', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.5px;
      text-align: center;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.95), 0 0 8px rgba(255,255,255,0.25);
      line-height: 1.25;
      max-height: 48px;
      overflow: hidden;
    }

    /* -------------------------------------------
       下枠（ステータス枠）
    ------------------------------------------- */
    .stats-frame {
      position: relative;
      height: auto;
      width: 97%;
      align-self: center;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      padding: 19px 34px 14px 28px;
      display: flex;
      flex-direction: column;
      gap: 7px;
      z-index: 2;
      filter: drop-shadow(0 5px 12px rgba(0,0,0,0.8));
    }
    
    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stat-left {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-left: 5px;
    }
    .stat-icon {
      font-size: 1.15rem;
      width: 22px;
      text-align: center;
      color: #FBBF24;
      filter: drop-shadow(0 0 5px rgba(251, 191, 36, 0.7));
    }

    .stat-name {
      font-family: 'Yu Gothic UI', '游ゴシック体', 'Yu Gothic', sans-serif;
      font-weight: bold;
      font-style: italic;
      font-size: 1.02rem;
      color: #F8FAFC;
      letter-spacing: 0.5px;
      text-shadow: 2px 2px 3px rgba(0,0,0,0.95);
    }

    .stat-points {
      font-family: 'Yu Gothic UI', '游ゴシック体', 'Yu Gothic', sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 1.02rem;
      color: #F8FAFC;
      text-shadow: 2px 2px 3px rgba(0,0,0,0.95);
      margin-left: 4px;
    }

    .stat-raw-value {
      font-family: 'HGP創英角ｺﾞｼｯｸUB', 'HGPSoeiKakugothicUB', 'HG創英角ｺﾞｼｯｸUB', 'HGS創英角ｺﾞｼｯｸUB', 'Meiryo', sans-serif;
      font-weight: bold;
      font-style: italic;
      font-size: 0.92rem;
      color: #FBBF24;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.5), 1px 1px 2px rgba(0,0,0,0.9);
      text-align: right;
      margin-right: 2px;
    }

    /* Sランク未満用のCSSフォールバック */
    .skill-banner-css {
      background: linear-gradient(90deg, #1E293B, #0F172A, #1E293B);
      border: 1px solid #334155;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.5);
      height: auto;
      margin-top: -15px;
      margin-bottom: 5px;
      padding: 10px 15px;
    }
    .stats-frame-css {
      background: #0F172A;
      border: 1px solid #334155;
      border-radius: 12px;
      box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
      padding: 15px 20px;
    }



    /* -------------------------------------------
       6th-30th Table Section
    ------------------------------------------- */
    .table-section {
      background: #1E293B;
      border-radius: 12px;
      border: 1px solid #334155;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .table-section h3 {
      font-size: 1.3rem;
      color: #F8FAFC;
      margin-bottom: 15px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .ranking-table {
      width: 100%;

      font-size: 0.9rem;
    }
    .ranking-table th, .ranking-table td {
      padding: 12px;
      text-align: left;
      border-bottom: 1px solid #334155;
    }
    .ranking-table th {
      background: #0F172A;
      color: #94A3B8;
      font-weight: 700;
      white-space: nowrap;
    }
    .ranking-table tr:hover {
      background: #243447;
    }
    .rank-number {
      font-size: 1.2rem;
      font-weight: 900;
      font-family: 'Outfit', sans-serif;
      color: #94A3B8;
    }
    .score-breakdown {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }
    .score-badge {
      font-size: 0.7rem;
      background: #0F172A;
      border: 1px solid #475569;
      padding: 2px 6px;
      border-radius: 4px;
      color: #CBD5E1;

    .score-badge strong { color: #38BDF8; }
    
    .btn-detail {
