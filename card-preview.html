<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EA TCG Card Component Preview - Dark Venus Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:ital,wght@0,400;0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090D16;
      color: #F8FAFC;
      font-family: 'Yu Gothic UI', '游ゴシック体', 'Yu Gothic', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 { font-family: 'Outfit', sans-serif; font-size: 2rem; margin-bottom: 10px; text-align: center; color: #38BDF8; text-transform: uppercase; letter-spacing: 1px; }
    p.subtitle { color: #94A3B8; margin-bottom: 40px; text-align: center; font-size: 0.95rem; }

    /* -------------------------------------------
       The Physical Card Container
    ------------------------------------------- */
    .tcg-card {
      position: relative;
      background-color: #05070B;
      border-radius: 16px;
      border: 3.5px solid #38BDF8;
      box-shadow: 0 15px 40px -5px rgba(0, 0, 0, 0.9), 0 0 25px rgba(56, 189, 248, 0.25);
      width: 400px;
      padding: 10px 8px 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 0px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tcg-card:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 25px 50px -5px rgba(56, 189, 248, 0.45);
    }

    /* --- TOP SECTION --- */
    .top-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: relative;
      min-height: 62px;
      padding: 4px 90px 4px 8px;
    }
    .ea-title-area {
      display: flex;
      flex-direction: column;
      gap: 2px;
      width: 100%;
    }
    .ea-name {
      font-size: 1.65rem;
      font-weight: 900;
      color: #F8FAFC;
      font-family: 'Outfit', sans-serif;
      font-style: italic;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.9);
      line-height: 1.1;
    }
    
    /* 🛠️ TotalScoreの文字位置調整 */
    .total-score-box {
      display: flex;
      align-items: baseline;
      gap: 8px;
      font-family: 'Outfit', sans-serif;
      font-style: italic;
      align-self: flex-end;           /* 👈 右側（ランクマーク寄り）に寄せる設定 */
      margin-right: 10px;             /* 👈 ランクマークとの距離調整 */
    }
    .total-score-label {
      font-size: 1.1rem;
      font-weight: 900;
      color: #F8FAFC;
      letter-spacing: 1px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
    }
    .total-score-val {
      font-size: 1.3rem;
      font-weight: 900;
      color: #FFF;
      text-shadow: 0 0 10px rgba(255,255,255,0.8);
    }

    /* Floating badge area (Right) */
    .rank-badge-area {
      position: absolute;
      top: -8px;
      right: -2px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      z-index: 10;
    }
    .rank-ss-logo {
      width: 95px;
      height: auto;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
      transition: transform 0.2s;
    }
    .rank-ss-logo:hover {
      transform: scale(1.08) rotate(2deg);
    }

    .date-badge {
      background: linear-gradient(135deg, #DC2626 0%, #991B1B 60%, #450A0A 100%);
      color: #FFF;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 0.8rem;
      letter-spacing: 1px;
      padding: 3px 12px;
      margin-top: -6px;
      margin-right: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.5);
      border: 1.5px solid #FCA5A5;
      border-radius: 3px;
      z-index: 11;
      transform: skewX(-12deg);
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
    }

    /* -------------------------------------------
       🛠️ 【中枠（サムネイル＆レーダー枠）】
    ------------------------------------------- */
    .art-frame {
      position: relative;
      height: 225px;
      width: 97%;
      align-self: center;
      border-radius: 10px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 6px 16px rgba(0,0,0,0.6);
      background-image: url('images/CardDesignParts/Frame/frame_SS.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 15px 35px 15px;
      z-index: 1;
    }

    .ea-thumbnail {
      width: 145px;
      height: 145px;
      border-radius: 18px;
      box-shadow: 8px 12px 25px rgba(0,0,0,0.85), -2px -2px 10px rgba(255,255,255,0.3);
      object-fit: cover;
      transform: perspective(800px) rotateY(15deg) rotateZ(-5deg) scale(1.05);
      z-index: 2;
      border: 2px solid rgba(255,255,255,0.4);
      background-color: #0f172a;
    }

    .radar-circle {
      width: 150px;
      height: 150px;
      background: rgba(9, 13, 22, 0.88);
      backdrop-filter: blur(6px);
      border: 2px solid rgba(56, 189, 248, 0.5);
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0,0,0,0.9), inset 0 0 10px rgba(56, 189, 248, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px;
      z-index: 2;
    }

    /* -------------------------------------------
       🛠️ 【スキル枠】
    ------------------------------------------- */
    .skill-banner-container {
      position: relative;
      height: 90px;
      width: 92%;
      align-self: center;
      background-image: url('images/CardDesignParts/Frame/frame_Skill.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 14px 20px 4px 20px;
      margin-top: -42px;
      margin-bottom: -9px;
      z-index: 5;
      filter: drop-shadow(0 6px 14px rgba(0,0,0,0.95));
    }
    
    .skill-tags-text {
      color: #FFF;
      font-weight: bold;
      font-style: italic;
      font-family: 'Yu Gothic UI', '游ゴシック体', 'Yu Gothic', sans-serif;
      font-size: 0.9rem;
      letter-spacing: 0.5px;
      text-align: center;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.95), 0 0 8px rgba(255,255,255,0.25);
      line-height: 1.25;
    }

    /* -------------------------------------------
       🛠️ 【下枠（ステータス枠）】
    ------------------------------------------- */
    .stats-frame {
      position: relative;
      height: auto;
      width: 97%;
      align-self: center;
      background-image: url('images/CardDesignParts/Frame/frame_Under.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      padding: 24px 34px 14px 28px;   /* 👈 右側の内側余白を22px→34pxに拡大（実測値の右側余白） */
      display: flex;
      flex-direction: column;
      gap: 7px;
      z-index: 2;
      filter: drop-shadow(0 5px 12px rgba(0,0,0,0.8));
    }
    
    .stat-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .stat-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 125px;               /* 👈 幅を固定せず自動調整にして点数を隣に配置 */
    }
    .stat-icon {
      font-size: 1.15rem;
      width: 22px;
      text-align: center;
      color: #FBBF24;
      filter: drop-shadow(0 0 5px rgba(251, 191, 36, 0.7));
    }

    /* 指標名（月間収益率, PF 等）: 游ゴシック 太字 斜体 */
    .stat-name {
      font-family: 'Yu Gothic UI', '游ゴシック体', 'Yu Gothic', sans-serif;
      font-weight: bold;
      font-style: italic;
      font-size: 1.02rem;
      color: #F8FAFC;
      letter-spacing: 0.5px;
      text-shadow: 2px 2px 3px rgba(0,0,0,0.95);
    }

    /* 🛠️ 内訳点数 (18 / 20): 左揃え ＋ 項目名との間隔スペース */
    .stat-points {
      font-family: 'Yu Gothic UI', '游ゴシック体', 'Yu Gothic', sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 1.02rem;
      color: #F8FAFC;
      text-shadow: 2px 2px 3px rgba(0,0,0,0.95);
      text-align: left;              /* 👈 左揃えにして項目名のすぐ右側に配置 */
      margin-left: 14px;             /* 👈 項目名との間のスペース調整 */
      flex: 1;                       /* 残りのスペースを埋める */
    }

    /* 実際の値 (+16.4%, 1.4 等): HGP創英角ｺﾞｼｯｸUB 太字 斜体 */
    .stat-raw-value {
      font-family: 'HGP創英角ｺﾞｼｯｸUB', 'HGPSoeiKakugothicUB', 'HG創英角ｺﾞｼｯｸUB', 'HGS創英角ｺﾞｼｯｸUB', 'Meiryo', sans-serif;
      font-weight: bold;
      font-style: italic;
      font-size: 1.02rem;
      color: #FBBF24;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-shadow: 0 0 8px rgba(251, 191, 36, 0.5), 1px 1px 2px rgba(0,0,0,0.9);
      text-align: right;
      margin-right: 6px;             /* 👈 右側の黄金枠との余白 */
    }

    /* Outside Card Actions (Price & Get EA Button) */
    .card-actions {
      display: flex;
      gap: 10px;
      align-items: stretch;
      width: 400px;
      margin-top: 15px;
    }
    .price-box {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .price-label { font-size: 0.65rem; color: #94A3B8; }
    .price-val { font-size: 1rem; font-weight: 900; color: #F8FAFC; }
    
    .cta-btn {
      flex: 1;
      background: linear-gradient(135deg, #0EA5E9, #0284C7);
      color: white;
      text-decoration: none;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 1.1rem;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.4);
      transition: all 0.2s;
    }
    .cta-btn:hover { background: linear-gradient(135deg, #38BDF8, #0EA5E9); transform: translateY(-2px); }

    .btn-detail {
      background: #1E293B;
      color: #94A3B8;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0 15px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-detail:hover { color: white; background: #334155; }
  </style>
</head>
<body>

  <h1><i class="fa-solid fa-layer-group"></i> Real Custom Assets TCG Card Preview</h1>
  <p class="subtitle">TotalScore右寄せ ＆ 点数の項目隣配置 ＆ 右側余白拡張版</p>

  <div style="display:flex; flex-direction:column; align-items:center;">

    <!-- The TCG Card Container -->
    <div class="tcg-card rank-ss">
      
      <!-- TOP SECTION -->
      <div class="top-section">
        <div class="ea-title-area">
          <div class="ea-name">SlopeRider Grid</div>
          <div class="total-score-box">
            <span class="total-score-label">TotalScore</span>
            <span class="total-score-val">81 / 100</span>
          </div>
        </div>
        
        <!-- Floating Rank Badge & Date -->
        <div class="rank-badge-area">
          <img src="images/CardDesignParts/Rank/rank_SS.png" class="rank-ss-logo" alt="SS Rank Logo">
          <div class="date-badge">2026.07</div>
        </div>
      </div>

      <!-- MIDDLE SECTION -->
      <div class="art-frame">
        <!-- Floating EA Thumbnail -->
        <img src="https://images.unsplash.com/photo-1614729939124-03290b55c9ce?auto=format&fit=crop&q=80&w=300" class="ea-thumbnail" alt="EA Thumbnail">
        
        <!-- Radar Chart inside black circle -->
        <div class="radar-circle">
          <canvas id="chart-sloperider"></canvas>
        </div>
      </div>

      <!-- SKILL BANNER SECTION -->
      <div class="skill-banner-container">
        <div class="skill-tags-text">
          トレンドフォロー / 逆張り / ナンピン /<br>
          スキャルピング / デイトレード /
        </div>
      </div>

      <!-- BOTTOM SECTION -->
      <div class="stats-frame">
        <div class="stat-row">
          <div class="stat-left">
            <i class="fa-solid fa-hand-fist stat-icon"></i>
            <span class="stat-name">月間収益率</span>
          </div>
          <div class="stat-points">18 / 20</div>
          <div class="stat-raw-value">+16.4%</div>
        </div>

        <div class="stat-row">
          <div class="stat-left">
            <i class="fa-solid fa-coins stat-icon"></i>
            <span class="stat-name">PF</span>
          </div>
          <div class="stat-points">16 / 20</div>
          <div class="stat-raw-value">1.4</div>
        </div>

        <div class="stat-row">
          <div class="stat-left">
            <i class="fa-solid fa-feather-pointed stat-icon"></i>
            <span class="stat-name">RF</span>
          </div>
          <div class="stat-points">16 / 20</div>
          <div class="stat-raw-value">6.12</div>
        </div>

        <div class="stat-row">
          <div class="stat-left">
            <i class="fa-solid fa-shield-halved stat-icon"></i>
            <span class="stat-name">DD</span>
          </div>
          <div class="stat-points">14 / 15</div>
          <div class="stat-raw-value">5.15</div>
        </div>

        <div class="stat-row">
          <div class="stat-left">
            <i class="fa-solid fa-hourglass-half stat-icon"></i>
            <span class="stat-name">稼働期間</span>
          </div>
          <div class="stat-points">11 / 15</div>
          <div class="stat-raw-value">2.3年</div>
        </div>

        <div class="stat-row">
          <div class="stat-left">
            <i class="fa-solid fa-heart stat-icon"></i>
            <span class="stat-name">収益安定性</span>
          </div>
          <div class="stat-points">9 / 10</div>
          <div class="stat-raw-value">11ヵ月</div>
        </div>
      </div>

    </div>

    <!-- Outside Card Actions -->
    <div class="card-actions">
      <div class="price-box">
        <span class="price-label">価格</span>
        <span class="price-val">無料</span>
      </div>
      <a href="https://www.mql5.com/ja/signals/2333407" target="_blank" class="cta-btn">
        <i class="fa-solid fa-bolt"></i> EAを入手
      </a>
      <button class="btn-detail" title="詳細スタッツ"><i class="fa-solid fa-chart-bar"></i></button>
    </div>

  </div>

  <script>
    Chart.defaults.color = 'rgba(255,255,255,0.7)';
    Chart.defaults.font.family = "'Outfit', sans-serif";
    Chart.defaults.font.style = 'italic';

    function createRadar(canvasId, values, color) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      new Header(ctx);
      new Chart(ctx, {
        type: 'radar',
        data: {
          labels: ['収益', 'PF', 'RF', 'DD', '期間', '安定'],
          datasets: [{
            data: values,
            backgroundColor: color.bg,
            borderColor: color.border,
            borderWidth: 1.5,
            pointRadius: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            r: {
              angleLines: { color: 'rgba(255, 255, 255, 0.2)' },
              grid: { color: 'rgba(255, 255, 255, 0.2)' },
              pointLabels: { color: '#F8FAFC', font: { size: 9, weight: 'bold', style: 'italic' } },
              ticks: { display: false },
              min: 0,
              max: 100
            }
          }
        }
      });
    }

    createRadar('chart-sloperider', [90, 80, 80, 93, 73, 90], { bg: 'rgba(56, 189, 248, 0.3)', border: '#38BDF8' });
  </script>
</body>
</html>
