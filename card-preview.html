<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EA TCG Card Component Preview - Dark Venus Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:ital,wght@0,400;0,700;0,900;1,700;1,900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090D16;
      color: #F8FAFC;
      font-family: 'Zen Maru Gothic', 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 { font-family: 'Outfit', sans-serif; font-size: 2rem; margin-bottom: 10px; text-align: center; color: #38BDF8; text-transform: uppercase; letter-spacing: 1px; }
    p.subtitle { color: #94A3B8; margin-bottom: 40px; text-align: center; font-size: 0.95rem; }

    .card-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 50px;
      justify-content: center;
      max-width: 1200px;
    }

    /* -------------------------------------------
       The Physical Card Container
    ------------------------------------------- */
    .tcg-card {
      position: relative;
      background-color: #0f172a;
      border-radius: 12px;
      border: 3px solid #38BDF8; /* Blue border as in mockup */
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.7);
      width: 380px;
      padding: 15px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tcg-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 20px 40px -5px rgba(56, 189, 248, 0.4);
    }

    /* --- TOP SECTION (Name & Giant Rank Badge) --- */
    .top-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: relative;
      min-height: 60px;
    }
    .ea-title-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .ea-name {
      font-size: 1.5rem;
      font-weight: 900;
      color: #F8FAFC;
      font-family: 'Outfit', sans-serif;
      font-style: italic; /* User request: Italic text */
      text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
      line-height: 1.1;
    }
    .ea-overall-stars {
      color: #FBBF24;
      font-size: 1rem;
      letter-spacing: 2px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    .ea-overall-stars .empty { color: #334155; }

    /* Massive floating badge area (Right) */
    .rank-badge-area {
      position: absolute;
      top: -30px;
      right: -20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }
    /* Placeholder for the user's PNG SSS/SS image */
    .rank-badge-img {
      width: 140px;
      height: 100px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px dashed #F59E0B;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #F59E0B;
      font-weight: 900;
      font-family: 'Outfit', sans-serif;
      font-style: italic;
      font-size: 2rem;
      text-shadow: 0 0 10px rgba(245, 158, 11, 0.8);
      backdrop-filter: blur(5px);
      /* This box will be replaced by the user's <img> tag later! */
    }
    .date-badge {
      background: #DC2626; /* Deep Red */
      color: #FFF;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 0.85rem;
      padding: 4px 16px;
      margin-top: -10px; /* Overlap with the badge above */
      box-shadow: 0 4px 6px rgba(0,0,0,0.6);
      border: 1px solid #7F1D1D;
      z-index: 11;
      transform: skewX(-10deg);
    }

    /* --- MIDDLE SECTION (Holographic Art Frame) --- */
    .art-frame {
      position: relative;
      height: 220px;
      border-radius: 12px;
      border: 2px solid #475569;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 5px 15px rgba(0,0,0,0.5);
      background-size: cover;
      background-position: center;
      overflow: hidden;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px;
    }
    
    /* Simulate holographic background for SSS */
    .rank-sss .art-frame {
      /* Placeholder rainbow prism gradient */
      background: linear-gradient(120deg, rgba(255,0,0,0.5), rgba(0,255,0,0.5), rgba(0,0,255,0.5), rgba(255,255,0,0.5)), 
                  repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,255,255,0.2) 10px, rgba(255,255,255,0.2) 20px);
      border-color: #FBBF24;
    }
    /* Simulate holographic background for SS */
    .rank-ss .art-frame {
      background: linear-gradient(120deg, rgba(245, 158, 11, 0.4), rgba(253, 224, 71, 0.6)), 
                  repeating-linear-gradient(-45deg, transparent, transparent 10px, rgba(255,255,255,0.2) 10px, rgba(255,255,255,0.2) 20px);
      border-color: #FDE047;
    }

    /* Floating EA Thumbnail Image */
    .ea-thumbnail {
      width: 140px;
      height: 140px;
      border-radius: 16px;
      box-shadow: 10px 10px 20px rgba(0,0,0,0.8), -2px -2px 10px rgba(255,255,255,0.2);
      object-fit: cover;
      /* The magic 3D tilt effect! */
      transform: perspective(800px) rotateY(15deg) rotateZ(-5deg) scale(1.05);
      z-index: 2;
    }

    /* Floating Radar Chart */
    .radar-circle {
      width: 130px;
      height: 130px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #334155;
      border-radius: 50%;
      box-shadow: 0 0 15px rgba(0,0,0,0.8);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 5px;
      z-index: 2;
    }

    /* Floating Pair/Type Badges inside Art Frame (Bottom Right) */
    .art-badges {
      position: absolute;
      bottom: 10px;
      right: 10px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: flex-end;
      z-index: 3;
    }
    .art-badge {
      background: linear-gradient(90deg, #1E293B, #0F172A);
      border: 1px solid #38BDF8;
      color: #38BDF8;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 4px;
      font-family: 'Outfit', sans-serif;
      box-shadow: 0 2px 5px rgba(0,0,0,0.6);
    }

    /* --- BOTTOM SECTION (Stats Grid) --- */
    .stats-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .stat-row {
      display: flex;
      align-items: center;
      background: rgba(30, 41, 59, 0.4);
      border-radius: 4px;
      height: 30px;
    }

    .stat-label-box {
      background: #1E293B;
      color: #94A3B8;
      font-weight: 700;
      font-size: 0.75rem;
      font-style: italic; /* User request */
      height: 100%;
      width: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
      border-left: 3px solid #38BDF8;
    }

    .stat-stars {
      flex: 1;
      color: #FBBF24;
      font-size: 0.8rem;
      padding-left: 10px;
      letter-spacing: 2px;
    }
    .stat-stars .empty { color: #334155; }

    .stat-value {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-style: italic; /* User request */
      font-size: 1.1rem;
      color: #F8FAFC;
      padding-right: 12px;
      text-align: right;
      width: 80px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    .val-positive { color: #34D399; }
    .val-danger { color: #F87171; }
    
  </style>
</head>
<body>

  <h1><i class="fa-solid fa-layer-group"></i> Ultimate EA Battle Card Layout</h1>
  <p class="subtitle">ユーザー様デザイン案（3Dサムネイル ＆ 巨大ランクバッジ ＆ 斜体フォント）完全再現版</p>

  <div class="card-grid">

    <!-- Card 1: Quantum King (SSS Rank) -->
    <div class="tcg-card rank-sss">
      
      <!-- TOP SECTION -->
      <div class="top-section">
        <div class="ea-title-area">
          <div class="ea-name">Quantum King</div>
          <div class="ea-overall-stars">★★★★★</div>
        </div>
        
        <!-- GIANT RANK BADGE (Waiting for user's PNG!) -->
        <div class="rank-badge-area">
          <div class="rank-badge-img">SSS (PNG)</div> <!-- Replace with <img src="..."> -->
          <div class="date-badge">2026.07度</div>
        </div>
      </div>

      <!-- MIDDLE SECTION (Art Frame) -->
      <div class="art-frame">
        <!-- Floating EA Logo/Thumbnail with 3D Tilt -->
        <img src="https://c.mql5.com/31/850/quantum-king-logo-200x200-2646.png" class="ea-thumbnail" alt="EA Thumbnail">
        
        <!-- Radar Chart inside black circle -->
        <div class="radar-circle">
          <canvas id="chart-quantum"></canvas>
        </div>

        <!-- Floating Badges -->
        <div class="art-badges">
          <div class="art-badge">M15 / Grid</div>
          <div class="art-badge">NZDCAD</div>
        </div>
      </div>

      <!-- BOTTOM SECTION (Slanted Stats) -->
      <div class="stats-container">
        <div class="stat-row">
          <div class="stat-label-box">攻撃(月利)</div>
          <div class="stat-stars">★★★★★</div>
          <div class="stat-value val-positive">+12.4%</div>
        </div>
        <div class="stat-row">
          <div class="stat-label-box">防御(最大DD)</div>
          <div class="stat-stars">★★★★<span class="empty">★</span></div>
          <div class="stat-value val-danger">15.1%</div>
        </div>
        <div class="stat-row">
          <div class="stat-label-box">収益性(PF)</div>
          <div class="stat-stars">★★★★★</div>
          <div class="stat-value">1.85</div>
        </div>
        <div class="stat-row">
          <div class="stat-label-box">資金効率(RF)</div>
          <div class="stat-stars">★★★★★</div>
          <div class="stat-value">14.30</div>
        </div>
        <div class="stat-row">
          <div class="stat-label-box">信頼(運用)</div>
          <div class="stat-stars">★★★★<span class="empty">★</span></div>
          <div class="stat-value">38週</div>
        </div>
        <div class="stat-row">
          <div class="stat-label-box">手頃(推奨)</div>
          <div class="stat-stars">★★★★<span class="empty">★</span></div>
          <div class="stat-value">$300</div>
        </div>
      </div>

    </div>
    
  </div>

  <script>
    Chart.defaults.color = 'rgba(255,255,255,0.7)';
    Chart.defaults.font.family = "'Outfit', sans-serif";
    Chart.defaults.font.style = 'italic'; // User request

    function createRadar(canvasId, values, color) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      new Chart(ctx, {
        type: 'radar',
        data: {
          labels: ['攻撃', '防御', '収益', '効率', '信頼', '手頃'],
          datasets: [{
            data: values,
            backgroundColor: color.bg,
            borderColor: color.border,
            borderWidth: 1.5,
            pointRadius: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            r: {
              angleLines: { color: 'rgba(255, 255, 255, 0.2)' },
              grid: { color: 'rgba(255, 255, 255, 0.2)' },
              pointLabels: { color: '#F8FAFC', font: { size: 9, weight: 'bold', style: 'italic' } },
              ticks: { display: false },
              min: 0,
              max: 100
            }
          }
        }
      });
    }

    createRadar('chart-quantum', [95, 75, 88, 92, 90, 85], { bg: 'rgba(56, 189, 248, 0.3)', border: '#38BDF8' });
  </script>
</body>
</html>
