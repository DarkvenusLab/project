<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EA TCG Card Component Preview - Dark Venus Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:ital,wght@0,400;0,700;0,900;1,700;1,900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #090D16;
      color: #F8FAFC;
      font-family: 'Zen Maru Gothic', 'Outfit', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
    }

    h1 { font-family: 'Outfit', sans-serif; font-size: 2rem; margin-bottom: 10px; text-align: center; color: #38BDF8; text-transform: uppercase; letter-spacing: 1px; }
    p.subtitle { color: #94A3B8; margin-bottom: 40px; text-align: center; font-size: 0.95rem; }

    .card-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 50px;
      justify-content: center;
      max-width: 1200px;
    }

    /* -------------------------------------------
       The Physical Card Container
    ------------------------------------------- */
    .tcg-card {
      position: relative;
      background-color: #0f172a;
      border-radius: 14px;
      border: 3px solid #38BDF8;
      box-shadow: 0 15px 35px -5px rgba(0, 0, 0, 0.8), 0 0 20px rgba(56, 189, 248, 0.2);
      width: 380px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .tcg-card:hover {
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 25px 45px -5px rgba(56, 189, 248, 0.4);
    }

    /* --- TOP SECTION (Name & Giant Rank Badge) --- */
    .top-section {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      position: relative;
      min-height: 55px;
    }
    .ea-title-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 2px;
      padding-top: 2px;
    }
    .ea-name {
      font-size: 1.5rem;
      font-weight: 900;
      color: #F8FAFC;
      font-family: 'Outfit', sans-serif;
      font-style: italic;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.9);
      line-height: 1.1;
      max-width: 240px;
    }
    .ea-overall-stars {
      color: #FBBF24;
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
    }
    .ea-overall-stars .empty { color: #334155; }

    /* Floating badge area (Right) using user's real rank_SS.png */
    .rank-badge-area {
      position: absolute;
      top: -6px; /* Lowered position as requested */
      right: -8px;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      z-index: 10;
    }
    .rank-ss-logo {
      width: 90px;
      height: auto;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
      transition: transform 0.2s;
    }
    .rank-ss-logo:hover {
      transform: scale(1.08) rotate(2deg);
    }

    .date-badge {
      background: linear-gradient(135deg, #DC2626 0%, #991B1B 60%, #450A0A 100%);
      color: #FFF;
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 0.8rem;
      letter-spacing: 1px;
      padding: 3px 12px;
      margin-top: -6px;
      margin-right: 5px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.8), inset 0 1px 1px rgba(255,255,255,0.5);
      border: 1.5px solid #FCA5A5;
      border-radius: 3px;
      z-index: 11;
      transform: skewX(-12deg);
      text-shadow: 1px 1px 3px rgba(0,0,0,0.9);
      position: relative;
    }

    /* --- MIDDLE SECTION (User's Custom Holographic frame_SS.png) --- */
    .art-frame {
      position: relative;
      height: 230px;
      border-radius: 10px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8), 0 6px 16px rgba(0,0,0,0.6);
      /* Using user's real frame_SS.png */
      background-image: url('images/CardDesignParts/Frame/frame_SS.png');
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px;
    }

    /* Floating EA Thumbnail Image with 3D Tilt Effect */
    .ea-thumbnail {
      width: 140px;
      height: 140px;
      border-radius: 18px;
      box-shadow: 8px 12px 25px rgba(0,0,0,0.85), -2px -2px 10px rgba(255,255,255,0.3);
      object-fit: cover;
      transform: perspective(800px) rotateY(15deg) rotateZ(-5deg) scale(1.05);
      z-index: 2;
      border: 2px solid rgba(255,255,255,0.4);
      background-color: #0f172a;
    }

    /* Floating Radar Chart */
    .radar-circle {
      width: 135px;
      height: 135px;
      background: rgba(9, 13, 22, 0.85);
      backdrop-filter: blur(6px);
      border: 2px solid rgba(56, 189, 248, 0.5);
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0,0,0,0.9), inset 0 0 10px rgba(56, 189, 248, 0.2);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 6px;
      z-index: 2;
    }

    /* Floating Pair/Type Badges inside Art Frame (Bottom Right) */
    .art-badges {
      position: absolute;
      bottom: 12px;
      right: 12px;
      display: flex;
      flex-direction: column;
      gap: 5px;
      align-items: flex-end;
      z-index: 3;
    }
    .art-badge {
      background: linear-gradient(90deg, #0F172A, #1E293B);
      border: 1px solid #38BDF8;
      color: #38BDF8;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 5px;
      font-family: 'Outfit', sans-serif;
      box-shadow: 0 3px 6px rgba(0,0,0,0.7);
    }

    /* --- BOTTOM SECTION (Stats Grid) --- */
    .stats-container {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .stat-row {
      display: flex;
      align-items: center;
      background: rgba(30, 41, 59, 0.5);
      border-radius: 4px;
      height: 30px;
    }

    .stat-label-box {
      background: #1E293B;
      color: #94A3B8;
      font-weight: 700;
      font-size: 0.75rem;
      font-style: italic;
      height: 100%;
      width: 115px;
      display: flex;
      align-items: center;
      justify-content: center;
      clip-path: polygon(10% 0, 100% 0, 90% 100%, 0% 100%);
      border-left: 3px solid #38BDF8;
    }

    .stat-stars {
      flex: 1;
      color: #FBBF24;
      font-size: 0.8rem;
      padding-left: 10px;
      letter-spacing: 2px;
    }
    .stat-stars .empty { color: #334155; }

    .stat-value {
      font-family: 'Outfit', sans-serif;
      font-weight: 900;
      font-style: italic;
      font-size: 1.1rem;
      color: #F8FAFC;
      padding-right: 12px;
      text-align: right;
      width: 80px;
      text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
    }
    .val-positive { color: #34D399; }
    .val-danger { color: #F87171; }

    /* Outside Card Actions (Price & Get EA Button) */
    .card-actions {
      display: flex;
      gap: 10px;
      align-items: stretch;
      width: 380px;
      margin-top: 15px;
    }
    .price-box {
      background: #111827;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px 15px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .price-label { font-size: 0.65rem; color: #94A3B8; }
    .price-val { font-size: 1rem; font-weight: 900; color: #F8FAFC; }
    
    .cta-btn {
      flex: 1;
      background: linear-gradient(135deg, #0EA5E9, #0284C7);
      color: white;
      text-decoration: none;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      border-radius: 8px;
      font-weight: 900;
      font-size: 1.1rem;
      box-shadow: 0 4px 12px rgba(14, 165, 233, 0.4);
      transition: all 0.2s;
    }
    .cta-btn:hover { background: linear-gradient(135deg, #38BDF8, #0EA5E9); transform: translateY(-2px); }

    .btn-detail {
      background: #1E293B;
      color: #94A3B8;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 0 15px;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .btn-detail:hover { color: white; background: #334155; }
  </style>
</head>
<body>

  <h1><i class="fa-solid fa-layer-group"></i> Real Asset TCG Card Preview</h1>
  <p class="subtitle">自作の『rank_SS.png』および『frame_SS.png』を実装着込み版</p>

  <div style="display:flex; flex-direction:column; align-items:center;">

    <!-- The TCG Card Container -->
    <div class="tcg-card rank-ss">
      
      <!-- TOP SECTION -->
      <div class="top-section">
        <div class="ea-title-area">
          <div class="ea-name">SlopeRider Grid</div>
          <div class="ea-overall-stars">★★★★<span class="empty">★</span></div>
        </div>
        
        <!-- User's Real rank_SS.png -->
        <div class="rank-badge-area">
          <img src="images/CardDesignParts/Rank/rank_SS.png" class="rank-ss-logo" alt="SS Rank Logo">
          <div class="date-badge">2026.07</div>
        </div>
      </div>

      <!-- MIDDLE SECTION (User's Real frame_SS.png Background) -->
      <div class="art-frame">
        <!-- Floating EA Logo/Thumbnail (Reliable Unsplash Cyberpunk image) -->
        <img src="https://images.unsplash.com/photo-1614729939124-03290b55c9ce?auto=format&fit=crop&q=80&w=300" class="ea-thumbnail" alt="EA Thumbnail">
        
        <!-- Radar Chart inside black circle -->
        <div class="radar-circle">
          <canvas id="chart-sloperider"></canvas>
        </div>

        <!-- Floating Badges -->
        <div class="art-badges">
          <div class="art-badge">M15 / Grid</div>
          <div class="art-badge">NZDCAD</div>
        </div>
      </div>

      <!-- BOTTOM SECTION (Slanted Stats) -->
      <div class="stats-container">
        <div class="stat-row">
          <div class="stat-label-box">攻撃(月利)</div>
          <div class="stat-stars">★★★<span class="empty">★★</span></div>
          <div class="stat-value val-positive">+12.4%</div>
        </div>
        <div class="stat-row">
          <div class="stat-label-box">防御(最大DD)</div>
          <div class="stat-stars">★★★★★</div>
          <div class="stat-value val-danger">15.1%</div>
        </div>
        <div class="stat-row">
          <div class="stat-label-box">収益性(PF)</div>
          <div class="stat-stars">★★★★<span class="empty">★</span></div>
          <div class="stat-value">1.85</div>
        </div>
        <div class="stat-row">
          <div class="stat-label-box">資金効率(RF)</div>
          <div class="stat-stars">★★★★<span class="empty">★</span></div>
          <div class="stat-value">14.30</div>
        </div>
        <div class="stat-row">
          <div class="stat-label-box">信頼(運用)</div>
          <div class="stat-stars">★★★★<span class="empty">★</span></div>
          <div class="stat-value">38週</div>
        </div>
        <div class="stat-row">
          <div class="stat-label-box">手頃(推奨)</div>
          <div class="stat-stars">★★★★<span class="empty">★</span></div>
          <div class="stat-value">$300</div>
        </div>
      </div>

    </div>

    <!-- Outside Card Actions -->
    <div class="card-actions">
      <div class="price-box">
        <span class="price-label">価格</span>
        <span class="price-val">無料</span>
      </div>
      <a href="https://www.mql5.com/ja/signals/2333407" target="_blank" class="cta-btn">
        <i class="fa-solid fa-bolt"></i> EAを入手
      </a>
      <button class="btn-detail" title="詳細スタッツ"><i class="fa-solid fa-chart-bar"></i></button>
    </div>

  </div>

  <script>
    Chart.defaults.color = 'rgba(255,255,255,0.7)';
    Chart.defaults.font.family = "'Outfit', sans-serif";
    Chart.defaults.font.style = 'italic';

    function createRadar(canvasId, values, color) {
      const ctx = document.getElementById(canvasId).getContext('2d');
      new Chart(ctx, {
        type: 'radar',
        data: {
          labels: ['攻撃', '防御', '収益', '効率', '信頼', '手頃'],
          datasets: [{
            data: values,
            backgroundColor: color.bg,
            borderColor: color.border,
            borderWidth: 1.5,
            pointRadius: 1
          }]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { display: false } },
          scales: {
            r: {
              angleLines: { color: 'rgba(255, 255, 255, 0.2)' },
              grid: { color: 'rgba(255, 255, 255, 0.2)' },
              pointLabels: { color: '#F8FAFC', font: { size: 9, weight: 'bold', style: 'italic' } },
              ticks: { display: false },
              min: 0,
              max: 100
            }
          }
        }
      });
    }

    createRadar('chart-sloperider', [75, 95, 85, 80, 80, 90], { bg: 'rgba(56, 189, 248, 0.3)', border: '#38BDF8' });
  </script>
</body>
</html>
